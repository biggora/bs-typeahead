name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run high-severity audit
        run: pnpm audit --audit-level=high

      - name: Build packages
        run: pnpm build

      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          REACT_VERSION=$(node -p "require('./packages/react/package.json').version")
          echo "Tag version:  $TAG_VERSION"
          echo "Core version: $CORE_VERSION"
          echo "React version: $REACT_VERSION"
          if [ "$TAG_VERSION" != "$CORE_VERSION" ] || [ "$TAG_VERSION" != "$REACT_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package versions (core=$CORE_VERSION, react=$REACT_VERSION)"
            exit 1
          fi

      - name: Verify package contents (dry-run)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_ARG=""
          if echo "$TAG_VERSION" | grep -q '-'; then
            TAG_ARG="--tag next"
          fi
          pnpm -r publish --no-private --dry-run $TAG_ARG

      - name: Publish packages
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_ARG=""
          if echo "$TAG_VERSION" | grep -q '-'; then
            TAG_ARG="--tag next"
          fi
          pnpm -r publish --no-private --provenance --access public $TAG_ARG
        # OIDC trusted publishing — no NPM_TOKEN needed when the
        # npm-publish environment is configured with provenance.
        # To fall back to token-based publishing, comment out
        # --provenance above and uncomment the following:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
